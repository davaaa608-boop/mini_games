<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <title>Хайч, Чулуу, Даавуу</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #fff; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: rgba(255,255,255,0.05); padding: 40px; border-radius: 20px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 450px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        h2 { color: #38bdf8; margin-bottom: 20px; }
        .btn-group { display: flex; justify-content: space-around; margin: 20px 0; }
        button { background: #1e293b; border: 2px solid #38bdf8; padding: 15px 20px; border-radius: 12px; color: white; font-size: 1.1rem; cursor: pointer; transition: 0.3s; }
        button:hover { background: #38bdf8; color: #0f172a; transform: translateY(-3px); }
        .result-box { margin-top: 20px; font-size: 1.2rem; background: rgba(56, 189, 248, 0.1); padding: 15px; border-radius: 10px; }
        .back { display: inline-block; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <h2>✂️ Хайч, Чулуу, Даавуу</h2>
        <form method="POST">
            <div class="btn-group">
                <button type="submit" name="choice" value="чулуу">🗿 Чулуу</button>
                <button type="submit" name="choice" value="хайч">✂️ Хайч</button>
                <button type="submit" name="choice" value="даавуу">📄 Даавуу</button>
            </div>
        </form>
        {% if user_choice %}
            <div class="result-box">
                <p>Таны сонголт: <b>{{ user_choice }}</b></p>
                <p>Компьютер: <b>{{ computer_choice }}</b></p>
                <h3 style="margin-top: 10px; color: #facc15;">{{ result }}</h3>
            </div>
        {% endif %}
        <br>
        <a href="/" class="back">← Нүүр хуудас руу буцах</a>
    </div>
</body>
</html>
