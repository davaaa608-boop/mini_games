<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <title>Зураг / Эможи таах</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #fff; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: rgba(255,255,255,0.05); padding: 40px; border-radius: 20px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 450px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        h2 { color: #38bdf8; margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
        .tile { background: #1e293b; border: 1px solid #475569; font-size: 2rem; padding: 20px; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .tile:hover { background: #334155; }
        .msg { font-size: 1.1rem; color: #34d399; margin-top: 15px; }
        .back { display: inline-block; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🧩 Эможи хослол олох</h2>
        <p style="color: #94a3b8; font-size: 0.9rem;">Ижил эможинуудыг олж дарна уу!</p>
        <div class="grid" id="board">
            <div class="tile" onclick="clickTile(this)" data-val="🍎">❓</div>
            <div class="tile" onclick="clickTile(this)" data-val="🍌">❓</div>
            <div class="tile" onclick="clickTile(this)" data-val="🍇">❓</div>
            <div class="tile" onclick="clickTile(this)" data-val="🍌">❓</div>
            <div class="tile" onclick="clickTile(this)" data-val="🍎">❓</div>
            <div class="tile" onclick="clickTile(this)" data-val="🍇">❓</div>
        </div>
        <div class="msg" id="msg"></div>
        <br>
        <a href="/" class="back">← Нүүр хуудас руу буцах</a>
    </div>
    <script>
        let firstSelection = null;
        let score = 0;
        function clickTile(el) {
            if(el.textContent !== '❓' || el.classList.contains('matched')) return;
            el.textContent = el.getAttribute('data-val');
            if(!firstSelection) {
                firstSelection = el;
            } else {
                if(firstSelection.getAttribute('data-val') === el.getAttribute('data-val')) {
                    firstSelection.classList.add('matched');
                    el.classList.add('matched');
                    score++;
                    firstSelection = null;
                    if(score === 3) {
                        document.getElementById('msg').textContent = "🎉 Баяр хүргэе! Та бүгдийг нь оллоо!";
                    }
                } else {
                    let prev = firstSelection;
                    setTimeout(() => {
                        prev.textContent = '❓';
                        el.textContent = '❓';
                    }, 500);
                    firstSelection = null;
                }
            }
        }
    </script>
</body>
</html>
