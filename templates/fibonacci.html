<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <title>Фибоначчигийн таавар</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #fff; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: rgba(255,255,255,0.05); padding: 40px; border-radius: 20px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 450px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        h2 { color: #38bdf8; margin-bottom: 15px; }
        .sequence { font-size: 1.5rem; background: #1e293b; padding: 15px; border-radius: 10px; margin: 15px 0; letter-spacing: 2px; color: #f43f5e; font-weight: bold; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #475569; background: #1e293b; color: #fff; font-size: 1rem; margin-bottom: 15px; text-align: center; outline: none; }
        button { width: 100%; padding: 12px; background: linear-gradient(45deg, #38bdf8, #6366f1); border: none; border-radius: 10px; color: white; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.9; transform: scale(1.02); }
        .message { margin-top: 20px; font-size: 1rem; color: #facc15; }
        .back { display: inline-block; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔢 Фибоначчигийн таавар</h2>
        <p style="color: #94a3b8; font-size: 0.9rem;">Дараалал дахь дараагийн тоог олно уу:</p>
        <div class="sequence">1, 1, 2, 3, 5, 8, 13, ?</div>
        <form method="POST">
            <input type="number" name="answer" placeholder="Хариуг бичнэ үү" required>
            <button type="submit">Шалгах</button>
        </form>
        {% if message %}
            <div class="message">{{ message }}</div>
        {% endif %}
        <br>
        <a href="/" class="back">← Нүүр хуудас руу буцах</a>
    </div>
</body>
</html>
